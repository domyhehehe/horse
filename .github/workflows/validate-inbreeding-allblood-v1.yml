name: validate-inbreeding-allblood-v1
on:
  push:
    branches:
      - chatgpt/inbreeding-scope-allblood-v1-20260906
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile inbreeding_performance_scope_allblood_pyto_v1_0.py
      - name: Self test
        run: python inbreeding_performance_scope_allblood_pyto_v1_0.py --self-test
